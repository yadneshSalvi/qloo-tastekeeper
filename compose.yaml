services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: qloo
      POSTGRES_PASSWORD: qloo_local_dev
      POSTGRES_DB: tastekeeper
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - tastekeeper-postgres:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U qloo -d tastekeeper']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  tastekeeper-postgres:
